{% extends "base.html" %} {% block title %}Admin Login - OTP Server{% endblock
%} {% block content %}
<h2>Admin Login</h2>
{% if error %}
<div class="alert alert-error">Invalid password. Please try again.</div>
{% endif %}
<form method="post">
  <div class="form-group">
    <label for="password">Password:</label>
    <input
      type="password"
      id="password"
      name="password"
      placeholder="Enter admin password"
      required
      autofocus
    />
  </div>
  <button type="submit">Login</button>
</form>
{% endblock %}
