<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}OTP Server Admin{% endblock %}</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 20px;
      }
      .container {
        max-width: 1200px;
        margin: 0 auto;
        background: white;
        border-radius: 10px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        padding: 30px;
      }
      h1,
      h2,
      h3 {
        color: #333;
        margin-bottom: 20px;
      }
      h2 {
        border-bottom: 3px solid #667eea;
        padding-bottom: 10px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin: 20px 0;
        background: white;
      }
      th,
      td {
        padding: 12px;
        text-align: left;
        border-bottom: 1px solid #ddd;
      }
      th {
        background: #667eea;
        color: white;
        font-weight: 600;
      }
      tr:hover {
        background: #f5f5f5;
      }
      input,
      select,
      button {
        padding: 10px;
        margin: 5px 0;
        border: 1px solid #ddd;
        border-radius: 5px;
        font-size: 14px;
      }
      input[type="text"],
      input[type="number"],
      input[type="password"],
      select {
        width: 100%;
        max-width: 400px;
      }
      button {
        background: #667eea;
        color: white;
        border: none;
        cursor: pointer;
        padding: 10px 20px;
        font-weight: 600;
        transition: background 0.3s;
      }
      button:hover {
        background: #5568d3;
      }
      .btn-danger {
        background: #f44336;
      }
      .btn-danger:hover {
        background: #d32f2f;
      }
      .btn-warning {
        background: #ff9800;
      }
      .btn-warning:hover {
        background: #f57c00;
      }
      .btn-success {
        background: #4caf50;
      }
      .btn-success:hover {
        background: #45a049;
      }
      .btn-small {
        font-size: 10px;
        padding: 5px 10px;
        margin: 2px;
      }
      .form-group {
        margin: 15px 0;
      }
      .form-group label {
        display: block;
        margin-bottom: 5px;
        font-weight: 600;
        color: #555;
      }
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
        margin: 20px 0;
      }
      .stat-card {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 20px;
        border-radius: 8px;
        text-align: center;
      }
      .stat-card h3 {
        color: white;
        margin-bottom: 10px;
      }
      .stat-card .value {
        font-size: 32px;
        font-weight: bold;
      }
      .back-link {
        display: inline-block;
        margin: 20px 0;
        color: #667eea;
        text-decoration: none;
        font-weight: 600;
      }
      .back-link:hover {
        text-decoration: underline;
      }
      .alert {
        padding: 15px;
        margin: 20px 0;
        border-radius: 5px;
      }
      .alert-error {
        background: #ffebee;
        color: #c62828;
        border-left: 4px solid #f44336;
      }
      .alert-success {
        background: #e8f5e9;
        color: #2e7d32;
        border-left: 4px solid #4caf50;
      }
      .docs-box {
        background: #f5f5f5;
        padding: 20px;
        border-radius: 5px;
        margin: 20px 0;
      }
      .docs-box code {
        background: #e0e0e0;
        padding: 2px 6px;
        border-radius: 3px;
        font-family: "Courier New", monospace;
      }
    </style>
    {% block extra_css %}{% endblock %}
  </head>
  <body>
    <div class="container">{% block content %}{% endblock %}</div>
    {% block extra_js %}{% endblock %}
  </body>
</html>
